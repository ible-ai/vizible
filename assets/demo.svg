<svg xmlns="http://www.w3.org/2000/svg" width="720" height="468" viewBox="0 0 720 468" role="img" aria-labelledby="title desc">
<title id="title">vizible ANSI output</title>
<desc id="desc">A dark terminal preview with color-coded log lines.</desc>
<rect width="720" height="468" rx="8" fill="#1e1e1e"/>
<text x="24" y="31" fill="#9da5b4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Captured ANSI output</text>
<text x="24" y="54" fill="#d4d4d4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Regular print</text>
<text x="24" y="84" fill="rgb(244, 55, 138)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">fetching batch 0</text>
<text x="24" y="114" fill="rgb(89, 114, 246)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">parsed 0 rows</text>
<text x="24" y="144" fill="rgb(244, 55, 138)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">fetching batch 1</text>
<text x="24" y="174" fill="rgb(89, 114, 246)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">parsed 10 rows</text>
<text x="24" y="204" fill="rgb(244, 55, 138)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">fetching batch 2</text>
<text x="24" y="234" fill="rgb(89, 114, 246)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">parsed 20 rows</text>
<text x="24" y="264" fill="#cd0000" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">red print</text>
<text x="24" y="294" fill="#00cd00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">green print</text>
<text x="24" y="324" fill="#cdcd00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">yellow print</text>
<text x="24" y="354" fill="#0000ee" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">blue print</text>
<text x="24" y="384" fill="#cd00cd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">magenta print</text>
<text x="24" y="414" fill="#00cdcd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">cyan print</text>
</svg>
